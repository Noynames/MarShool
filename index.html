<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сплетни марьявской школы</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #fcf9f2;
      background-image: radial-gradient(#f0e6d2 2px, transparent 2px);
      background-size: 30px 30px;
      color: #4a3f35;
      min-height: 100vh;
      padding-bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .site-header {
      text-align: center;
      padding: 40px 20px 20px;
      z-index: 2;
    }

    .site-header h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #7a5c46;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .site-header p {
      font-size: 1rem;
      color: #9c7e68;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
      background: #fff;
      padding: 8px;
      border-radius: 20px;
      border: 2px solid #f0e6d2;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
      max-width: 480px;
      box-shadow: 0 6px 15px rgba(180, 160, 140, 0.1);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #9c7e68;
      font-size: 0.95rem;
      font-weight: 800;
      padding: 12px 20px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1;
    }

    .nav-btn:hover { color: #7a5c46; }
    .nav-btn.active {
      background: #ffd8b4;
      color: #7a5c46;
      box-shadow: 0 2px 8px rgba(255, 158, 122, 0.3);
    }

    .card {
      position: relative;
      z-index: 1;
      background: #ffffff;
      border-radius: 24px;
      padding: 30px 25px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(180, 160, 140, 0.2);
      border: 2px solid #f0e6d2;
    }

    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: 450px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .feed-container::-webkit-scrollbar { width: 6px; }
    .feed-container::-webkit-scrollbar-thumb { background: #f0e6d2; border-radius: 10px; }

    .empty-feed {
      text-align: center;
      padding: 40px 20px;
      color: #9c7e68;
      background: #fcf9f2;
      border-radius: 16px;
      border: 2px dashed #f0e6d2;
    }
    
    .empty-feed .icon { font-size: 3rem; margin-bottom: 10px; display: block; }
    .empty-feed h3 { color: #7a5c46; font-size: 1.2rem; margin-bottom: 5px; }
    .empty-feed p { font-size: 0.9rem; }

    .question-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .random-nick-box { background: #fff4e6; padding: 12px; border-radius: 12px; font-size: 0.9rem; border: 2px dashed #ffd8b4; margin-bottom: 5px; color: #7a5c46; font-weight: 600; }
    .random-nick-box strong { color: #d97746; }
    .question-form textarea { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #f0e6d2; background: #fcf9f2; color: #4a3f35; font-family: inherit; font-size: 1rem; resize: vertical; min-height: 100px; outline: none; transition: border 0.3s; }
    .question-form textarea:focus { border-color: #ff9e7a; }
    
    .submit-btn { background: #ff9e7a; color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all 0.2s; box-shadow: 0 6px 15px rgba(255, 158, 122, 0.3); }
    .submit-btn:hover { transform: translateY(-2px); background: #ff8a5c; }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

    footer { text-align: center; margin-top: 28px; font-size: 0.8rem; color: #9c7e68; font-weight: 600; padding-bottom: 20px; }

    @media (max-width: 480px) {
      .card { padding: 25px 18px; }
      h1 { font-size: 1.6rem; }
      .nav-btn { padding: 10px 15px; font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <h1>Сплетни марьявской школы</h1>
    <p>Только свежие новости 🤫</p>
  </header>

  <div class="nav-tabs">
    <button class="nav-btn active" onclick="openTab('gossips', this)">📰 Лента</button>
    <button class="nav-btn" onclick="openTab('suggest', this)">📝 Предложить</button>
  </div>

  <main class="card">
    <div id="gossips" class="tab-content active">
      <div class="feed-container">
        <div class="empty-feed">
          <span class="icon">📭</span>
          <h3>Пока сплетен нет...</h3>
          <p>Но ты можешь стать первым!<br>Перейди во вкладку «Предложить».</p>
        </div>
      </div>
    </div>

    <div id="suggest" class="tab-content">
      <div style="text-align: center; margin-bottom: 15px; color: #9c7e68; font-size: 0.95rem; font-weight: 600;">
        Хочешь поделиться новостью? Пиши! Твоё сообщение придет админу.
      </div>
      
      <form class="question-form" id="tgForm" onsubmit="sendMessage(event)">
        <div class="random-nick-box">Твой случайный ник: <strong id="nickname">Гость_0000</strong></div>
        <textarea id="questionText" placeholder="Напиши свою сплетню сюда..." required></textarea>
        <button type="submit" class="submit-btn" id="sendBtn">Отправить сплетню</button>
      </form>
    </div>
  </main>

  <footer>© 2026 Сплетни марьявской школы</footer>

  <script>
    function generateNick() {
      const randomNum = Math.floor(1000 + Math.random() * 9000);
      document.getElementById('nickname').innerText = 'Гость_' + randomNum;
    }
    window.onload = generateNick;

    const TG_TOKEN = '8880758052:AAG573adRoPPt1s0P_fa9-kzgRLMy8yogYI';
    const TG_CHAT_ID = '6474419939'; 

    async function sendMessage(event) {
      event.preventDefault();
      const btn = document.getElementById('sendBtn');
      const textInput = document.getElementById('questionText');
      const nick = document.getElementById('nickname').innerText;
      const message = `🤫 *НОВАЯ СПЛЕТНЯ*\n\n👤 От: *${nick}*\n💬 Текст: ${textInput.value}`;
      
      btn.innerText = 'Отправка...'; 
      btn.disabled = true;

      // Создаем "таймер", который прервет запрос, если он висит дольше 7 секунд
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 7000);

      try {
        const response = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TG_CHAT_ID, text: message, parse_mode: 'Markdown' }),
          signal: controller.signal // Привязываем таймер к запросу
        });

        clearTimeout(timeoutId); // Если успели, отключаем таймер

        if (response.ok) {
          btn.innerText = 'Отправлено! ✅'; 
          btn.style.background = '#28a745';
          textInput.value = ''; 
          generateNick();
          setTimeout(() => { 
            btn.innerText = 'Отправить сплетню'; 
            btn.style.background = ''; 
            btn.disabled = false; 
          }, 3000);
        } else { 
          throw new Error(); 
        }
      } catch (error) {
        clearTimeout(timeoutId);
        
        // Если это была ошибка таймаута (телефон долго грузит)
        if (error.name === 'AbortError') {
          alert('Телеграм не отвечает. Пожалуйста, проверь интернет и попробуй еще раз!');
        } else {
          alert('Ошибка отправки. Возможно, бот не активирован.');
        }
        
        btn.innerText = 'Отправить сплетню'; 
        btn.style.background = ''; 
        btn.disabled = false; 
      }
    }

    function openTab(tabName, btn) {
      let i, tabcontent = document.getElementsByClassName("tab-content");
      for (i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
      let tablinks = document.getElementsByClassName("nav-btn");
      for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
      document.getElementById(tabName).classList.add("active");
      btn.classList.add("active");
    }
  </script>
</body>
</html>
