<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сплетни Марьяновской школы</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Comfortaa:wght@400;700&family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fcf9f2; --dot-color: #f0e6d2; --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #4a3f35; --text-muted: #9c7e68; --accent: #ff9e7a; --accent-light: #ffd8b4; --border: rgba(240, 230, 210, 0.5);
      --font-main: 'Nunito', sans-serif;
      --shadow: 0 8px 32px 0 rgba(180, 160, 140, 0.15);
    }
    body.dark-theme {
      --bg-color: #121212; --dot-color: #1e1e1e; --card-bg: rgba(30, 30, 30, 0.85);
      --text-main: #e0e0e0; --text-muted: #888888; --accent: #ff8a5c; --accent-light: #3d2a20; --border: rgba(60, 60, 60, 0.5);
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    }
    body.font-comfort { --font-main: 'Comfortaa', cursive; }
    body.font-script { --font-main: 'Marck Script', cursive; }
    
    body.bg-stars { --bg-color: #0b0b1a; background-image: radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)); background-size: 200px 200px; }
    body.bg-matrix { --bg-color: #000; background-image: linear-gradient(180deg, rgba(0,255,0,0.15) 0%, transparent 10%, transparent 90%, rgba(0,255,0,0.15) 100%), linear-gradient(90deg, rgba(0,255,0,0.1) 1px, transparent 1px); background-size: 100% 100%, 30px 30px; }
    body.bg-paper { --bg-color: #fdfbf7; background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px); background-size: 20px 20px; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-main); background-color: var(--bg-color);
      color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      transition: background-color 0.5s ease, color 0.3s, font-family 0.3s;
    }
    
    .card, .gossip-card { 
      background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }

    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: absolute; top: 0; left: 0; z-index: 10; }
    .profile-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--card-bg); border: 2px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 0 10px var(--accent); }
    .controls { display: flex; gap: 10px; }
    .icon-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .site-header { text-align: center; padding: 70px 20px 20px; z-index: 2; width: 100%; cursor: pointer; user-select: none; }
    .site-header h1 { font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 25px; background: var(--card-bg); padding: 8px; border-radius: 20px; border: 2px solid var(--border); flex-wrap: wrap; justify-content: center; width: 90%; max-width: 480px; }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.8rem; font-weight: 800; padding: 10px 8px; border-radius: 14px; cursor: pointer; flex: 1; position: relative; }
    .nav-btn.active { background: var(--accent-light); color: var(--text-main); }
    #adminTabBtn { display: none; background: #ff4d4d; color: white; }

    .card { border-radius: 24px; padding: 25px 20px; max-width: 480px; width: 90%; margin-bottom: 40px; }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    .gossip-card { border-radius: 16px; text-align: left; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 20px; }
    .gossip-image { width: 100%; max-height: 300px; object-fit: cover; border-bottom: 2px solid var(--border); }
    .gossip-content { padding: 15px; }
    .gossip-author-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .author-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border: 2px solid var(--accent); }
    .gossip-author { font-size: 0.85rem; font-weight: 800; color: var(--accent); }
    .gossip-text { font-size: 1rem; line-height: 1.5; color: var(--text-main); font-weight: 600; margin-bottom: 15px; }

    .chat-container { display: flex; flex-direction: column; height: 400px; background: var(--bg-color); border-radius: 16px; border: 2px solid var(--border); overflow: hidden; }
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; }
    .msg.me { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 0; }
    .msg.them { background: var(--card-bg); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid var(--border); }
    .chat-input-row { display: flex; padding: 10px; background: var(--card-bg); border-top: 1px solid var(--border); gap: 10px; }
    .chat-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); outline: none; }

    .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .profile-cover { width: 100%; height: 120px; background: var(--accent-light); border-radius: 16px; margin-bottom: -40px; background-size: cover; background-position: center; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--card-bg); border: 4px solid var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 2rem; position: relative; z-index: 2; }
    .profile-info { text-align: center; margin-top: 10px; }
    .profile-username { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }
    .profile-bio { font-size: 0.9rem; color: var(--text-muted); }

    .submit-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }
    .question-form { display: flex; flex-direction: column; gap: 12px; }
    .empty-feed { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    footer { text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); padding-bottom: 20px; }
    
    .admin-chat-item { background: var(--bg-color); border: 1px solid var(--border); padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; }
    .admin-nav { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .admin-nav button { flex: 1; padding: 10px; border: none; border-radius: 10px; background: var(--card-bg); color: var(--text-main); font-weight: bold; cursor: pointer; border: 2px solid var(--border); font-size: 0.8rem; }
    .admin-nav button.active { background: var(--accent); color: white; }
    
    .user-admin-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
    .user-admin-item span { font-weight: 700; color: var(--accent); }
    .admin-input { padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); font-size: 0.8rem; width: 100px; margin-right: 5px; }
    .admin-save-btn { background: #28a745; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }

    /* Стили для мем-генератора */
    .meme-container { position: relative; width: 100%; margin-bottom: 15px; display: none; overflow: hidden; border-radius: 10px; }
    .meme-container img { width: 100%; display: block; }
    .draggable-text {
      position: absolute; color: white; font-family: 'Impact', sans-serif; text-transform: uppercase;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      font-size: 2rem; line-height: 1.1; cursor: grab; user-select: none; padding: 5px; text-align: center;
    }
    .draggable-text:active { cursor: grabbing; }
    .file-upload-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
    .file-label { background: var(--card-bg); border: 2px dashed var(--border); padding: 10px; border-radius: 10px; font-weight: 700; color: var(--text-muted); cursor: pointer; text-align: center; flex: 1; }
    #imageInput, #memeImageInput { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="profile-btn" id="myAvatarBtn" onclick="openTab('profile', document.querySelectorAll('.nav-btn')[4])">🦊</div>
    <div class="controls">
      <button class="icon-btn" onclick="cycleBackground()" id="bgBtn" title="Сменить фон">🌌</button>
      <button class="icon-btn" onclick="cycleFont()" id="fontBtn" title="Сменить шрифт">🅰️</button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
  </div>
  
  <header class="site-header" onclick="openAdmin()">
    <h1>Сплетни Марьяновской школы</h1>
    <p>Только свежие новости 🤫</p>
  </header>

  <div class="nav-tabs">
    <button class="nav-btn active" onclick="openTab('gossips', this)">📰 Лента</button>
    <button class="nav-btn" onclick="openTab('messenger', this)">💬 Поиск</button>
    <button class="nav-btn" id="chatsTabBtn" onclick="openTab('chatsList', this)">📥 Чаты <span id="unreadBadge" style="display:none; background:red; color:white; padding:2px 6px; border-radius:10px; font-size:0.6rem; position:absolute; top:2px; right:2px;">!</span></button>
    <button class="nav-btn" onclick="openTab('memes', this)">🖼️ Мемы</button>
    <button class="nav-btn" onclick="openTab('profile', this)">👤 Профиль</button>
    <button class="nav-btn" onclick="openTab('suggest', this)">📝 Предложить</button>
    <button class="nav-btn" id="adminTabBtn" onclick="openTab('admin', this)">🛠️ Админка</button>
  </div>

  <main class="card">
    <div id="gossips" class="tab-content active">
      <div class="feed-container" id="mainFeed"></div>
    </div>

    <div id="messenger" class="tab-content">
      <h3 style="margin-bottom: 15px;">Поиск людей 🔍</h3>
      <input type="text" class="search-user-input" id="searchUserInput" placeholder="Введи @username друга..." oninput="searchUsers()" style="width: 100%; padding: 12px; border-radius: 12px; border: 2px solid var(--border); background: var(--card-bg); margin-bottom: 15px;">
      <div id="searchResults"></div>
    </div>

    <div id="chatsList" class="tab-content">
      <h3 style="margin-bottom: 15px;">Твои чаты 💬</h3>
      <div id="myChatsList"></div>
    </div>

    <div id="chatWindow" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <button onclick="openTab('chatsList', document.getElementById('chatsTabBtn'))" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">⬅️</button>
        <h3 style="margin:0;">@<span id="chatTargetName"></span></h3>
        <div style="width: 24px;"></div>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="chatInput" placeholder="Написать сообщение...">
          <button class="comment-btn" onclick="sendMessageToUser()">➤</button>
        </div>
      </div>
    </div>

    <!-- ГЕНЕРАТОР МЕМОВ -->
    <div id="memes" class="tab-content">
      <h3 style="margin-bottom: 15px; text-align: center;">Генератор мемов 😂</h3>
      <div class="question-form">
        <input type="file" id="memeImageInput" accept="image/*" onchange="loadMemeImage(this)" style="margin-bottom: 10px;">
        <input type="text" id="memeTextInput" placeholder="Введи текст для мема..." style="padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <button class="submit-btn" onclick="addTextToMeme()" style="background: #4facfe; margin-bottom: 10px;">Добавить текст</button>
        <div class="meme-container" id="memeContainer">
          <img id="memeImage" src="" alt="Мем" crossorigin="anonymous">
        </div>
        <button class="submit-btn" onclick="publishMeme()" id="publishMemeBtn" style="display: none; background: #28a745;">Опубликовать мем 🚀</button>
      </div>
    </div>

    <div id="profile" class="tab-content">
      <div class="profile-header">
        <div class="profile-cover" id="profileCover"></div>
        <div class="profile-avatar" id="profileAvatar">🦊</div>
        <div class="profile-info">
          <div class="profile-username" id="profileUsername">@гость</div>
          <div class="profile-bio" id="profileBio">Тут будет твое био</div>
        </div>
      </div>
      <div class="question-form">
        <label>Сменить юзернейм (только англ., до 10 символов)</label>
        <input type="text" id="newUsernameInput" placeholder="username" maxlength="10" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <label>Сменить био</label>
        <input type="text" id="newBioInput" placeholder="О себе" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <label>Обои профиля</label>
        <input type="file" id="coverInput" accept="image/*" onchange="uploadCover(this)">
        <button class="submit-btn" onclick="saveProfile()">Сохранить профиль</button>
      </div>
    </div>

    <div id="suggest" class="tab-content">
      <form class="question-form" id="tgForm" onsubmit="sendMessage(event)">
        <textarea id="questionText" placeholder="Напиши свою сплетню..." required style="padding: 14px; border-radius: 12px; border: 2px solid var(--border); min-height: 100px;"></textarea>
        
        <div class="file-upload-wrapper">
          <label for="imageInput" class="file-label" id="fileLabel">📷 Прикрепить фото</label>
          <input type="file" id="imageInput" accept="image/*" onchange="previewImage(this)">
        </div>

        <button type="submit" class="submit-btn" id="sendBtn">Отправить</button>
      </form>
    </div>

    <div id="admin" class="tab-content">
      <div class="admin-nav">
        <button id="btnAdminPending" class="active" onclick="switchAdminTab('pending')">На проверку</button>
        <button id="btnAdminChats" onclick="switchAdminTab('chats')">Переписки</button>
        <button id="btnAdminUsers" onclick="switchAdminTab('users')">Пользователи</button>
      </div>
      <div class="feed-container" id="adminFeed"></div>
    </div>
  </main>
  <footer>© 2026 Сплетни Марьяновской школы</footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://owcxvgvajlbrpirwvjhr.supabase.co', 'sb_publishable_ML7qbFIVKcg4z_lD8Gr0CQ_wh611unv');

    const defaultNicks = ["altyxa", "shtyrmovik", "sigma", "skibidi", "chad", "gyatt", "rizzler", "sigma_boy", "ohio", "fanum_tax", "kai_cenat", "grimace", "amogus", "sussy", "gigachad", "npc", "cringe", "based", "copium", "hopium", "pov", "ratio", "cap", "bussin"];

    let currentChatTarget = null;
    let adminClicks = 0;
    let currentBgIndex = localStorage.getItem('bgIndex') || 0;
    let currentAdminView = 'pending';
    let selectedFile = null;

    const backgrounds = ['default', 'bg-stars', 'bg-matrix', 'bg-paper'];
    const fonts = ['default', 'font-comfort', 'font-script'];

    function generateDefaultNick() {
      const randomNick = defaultNicks[Math.floor(Math.random() * defaultNicks.length)];
      return `${randomNick}${Math.floor(10 + Math.random() * 90)}`;
    }

    window.cycleBackground = () => {
      currentBgIndex = (parseInt(currentBgIndex) + 1) % backgrounds.length;
      localStorage.setItem('bgIndex', currentBgIndex);
      document.body.className = document.body.className.replace(/bg-\S+/g, '').trim();
      const bg = backgrounds[currentBgIndex];
      if (bg !== 'default') document.body.classList.add(bg);
    }

    window.cycleFont = () => {
      let fIdx = (parseInt(localStorage.getItem('fontIndex') || 0) + 1) % fonts.length;
      localStorage.setItem('fontIndex', fIdx);
      document.body.classList.remove('font-comfort', 'font-script');
      if (fonts[fIdx] !== 'default') document.body.classList.add(fonts[fIdx]);
    }

    window.toggleTheme = () => {
      document.body.classList.toggle('dark-theme');
      document.getElementById('themeBtn').innerText = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
    }

    // --- REALTIME (МГНОВЕННОЕ ОБНОВЛЕНИЕ) ---
    function subscribeToChanges() {
      supabase.channel('messages-channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          const myName = localStorage.getItem('myUsername') || 'гость';
          const newMsg = payload.new;
          
          if (newMsg.receiver_name === myName && currentChatTarget !== newMsg.sender_name) {
            document.getElementById('unreadBadge').style.display = 'block';
          }
          
          if (currentChatTarget && (newMsg.sender_name === currentChatTarget || newMsg.receiver_name === currentChatTarget)) {
            loadMessages();
          }
          if (document.getElementById('chatsList').classList.contains('active')) {
            loadChats();
          }
        }).subscribe();

      supabase.channel('gossips-channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'gossips' }, payload => {
          loadGossips();
          if (document.getElementById('admin').classList.contains('active')) {
            loadAdminData();
          }
        }).subscribe();
    }

    async function loadGossips() {
      const { data } = await supabase.from('gossips').select('*').eq('status', 'published').eq('is_deleted', false).order('id', { ascending: false });
      const mainFeed = document.getElementById('mainFeed');
      if (!data || data.length === 0) {
        mainFeed.innerHTML = `<div class="empty-feed">Пока сплетен нет...</div>`;
      } else {
        mainFeed.innerHTML = data.map(g => `
          <div class="gossip-card">
            ${g.image_url ? `<img src="${g.image_url}" class="gossip-image">` : ''}
            ${g.meme_base64 ? `<img src="${g.meme_base64}" class="gossip-image">` : ''}
            <div class="gossip-content">
              <div class="gossip-author-row">
                <div class="author-avatar">🦊</div>
                <div class="gossip-author">@${g.author}</div>
              </div>
              ${g.text ? `<div class="gossip-text">${g.text}</div>` : ''}
            </div>
          </div>
        `).join('');
      }
    }

    window.saveProfile = async () => {
      let uname = document.getElementById('newUsernameInput').value.trim().replace('@', '').toLowerCase();
      const bio = document.getElementById('newBioInput').value.trim();
      
      const regex = /^[a-z0-9_]{1,10}$/;
      if (!regex.test(uname)) { 
        alert('Юзернейм должен содержать только английские строчные буквы, цифры и _ (до 10 символов)!'); 
        return; 
      }

      const { data: existingUser } = await supabase.from('profiles').select('id').ilike('username', uname).neq('username', localStorage.getItem('myUsername'));
      if (existingUser && existingUser.length > 0) {
        alert('Этот ник уже занят!');
        return;
      }

      const { error } = await supabase.from('profiles').upsert({ username: uname, bio: bio, cover_url: localStorage.getItem('profileCover') }, { onConflict: 'username' });

      if (!error) {
        localStorage.setItem('myUsername', uname);
        localStorage.setItem('myBio', bio);
        loadProfile();
        alert('Профиль сохранен!');
      } else { alert('Этот ник уже занят!'); }
    }

    window.uploadCover = async (input) => {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const base64 = e.target.result;
          localStorage.setItem('profileCover', base64);
          document.getElementById('profileCover').style.backgroundImage = `url(${base64})`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function loadProfile() {
      const savedUname = localStorage.getItem('myUsername');
      if (!savedUname) {
        const newNick = generateDefaultNick();
        localStorage.setItem('myUsername', newNick);
        await supabase.from('profiles').insert([{ username: newNick }]);
      }
      document.getElementById('profileUsername').innerText = `@${localStorage.getItem('myUsername')}`;
      document.getElementById('profileBio').innerText = localStorage.getItem('myBio') || 'Тут будет твое био';
      if (localStorage.getItem('profileCover')) document.getElementById('profileCover').style.backgroundImage = `url(${localStorage.getItem('profileCover')})`;
    }

    window.loadChats = async () => {
      const myName = localStorage.getItem('myUsername');
      const { data } = await supabase.from('messages').select('*').or(`sender_name.eq.${myName},receiver_name.eq.${myName}`).order('created_at', { ascending: false });
      
      const chatBox = document.getElementById('myChatsList');
      if (!data || data.length === 0) { chatBox.innerHTML = `<div class="empty-feed">У тебя пока нет переписок.</div>`; return; }

      const users = new Set();
      data.forEach(msg => {
        if (msg.sender_name !== myName) users.add(msg.sender_name);
        if (msg.receiver_name !== myName) users.add(msg.receiver_name);
      });

      chatBox.innerHTML = Array.from(users).map(user => `<div class="admin-chat-item" style="cursor:pointer;" onclick="openChat('${user}')"><strong>@${user}</strong></div>`).join('');
    }

    window.searchUsers = async () => {
      const query = document.getElementById('searchUserInput').value.replace('@', '').trim().toLowerCase();
      const resultsBox = document.getElementById('searchResults');
      if (query.length < 2) { resultsBox.innerHTML = ''; return; }

      const { data } = await supabase.from('profiles').select('*').ilike('username', `%${query}%`);
      resultsBox.innerHTML = (!data || data.length === 0) ? `<div class="empty-feed" style="padding: 10px;">Никого не найдено</div>` : data.map(user => `<div class="admin-chat-item" style="cursor: pointer;" onclick="openChat('${user.username}')"><strong>@${user.username}</strong></div>`).join('');
    }

    window.openChat = async (username) => {
      currentChatTarget = username;
      document.getElementById('chatTargetName').innerText = username;
      openTab('chatWindow', document.getElementById('chatsTabBtn'));
      await loadMessages();
    }

    async function loadMessages() {
      if (!currentChatTarget) return;
      const myName = localStorage.getItem('myUsername');
      const { data } = await supabase.from('messages').select('*').or(`and(sender_name.eq.${myName},receiver_name.eq.${currentChatTarget}),and(sender_name.eq.${currentChatTarget},receiver_name.eq.${myName})`).order('created_at', { ascending: true });

      const chatBox = document.getElementById('chatMessages');
      if (!data || data.length === 0) { chatBox.innerHTML = `<div class="empty-feed">Начни диалог с @${currentChatTarget}</div>`; }
      else {
        chatBox.innerHTML = data.map(msg => `<div class="msg ${msg.sender_name === myName ? 'me' : 'them'}">${msg.text}</div>`).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    window.sendMessageToUser = async () => {
      if (!currentChatTarget) return;
      const input = document.getElementById('chatInput');
      const myName = localStorage.getItem('myUsername');
      if(!input.value.trim()) return;

      await supabase.from('messages').insert([{ sender_name: myName, receiver_name: currentChatTarget, text: input.value }]);
      input.value = '';
    }

    // --- МЕМ-ГЕНЕРАТОР ---
    window.loadMemeImage = (input) => {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          document.getElementById('memeImage').src = e.target.result;
          document.getElementById('memeContainer').style.display = 'block';
          document.getElementById('publishMemeBtn').style.display = 'block';
          document.querySelectorAll('.draggable-text').forEach(el => el.remove());
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    window.addTextToMeme = () => {
      const text = document.getElementById('memeTextInput').value;
      if (!text) return;

      const container = document.getElementById('memeContainer');
      const newText = document.createElement('div');
      newText.className = 'draggable-text';
      newText.innerText = text;
      newText.style.left = '50%';
      newText.style.top = '50%';
      newText.style.transform = 'translate(-50%, -50%)';
      
      let isDragging = false;
      let offsetX, offsetY;

      newText.addEventListener('mousedown', (e) => {
        isDragging = true;
        offsetX = e.clientX - newText.getBoundingClientRect().left;
        offsetY = e.clientY - newText.getBoundingClientRect().top;
        newText.style.transform = 'none';
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let x = e.clientX - offsetX - container.getBoundingClientRect().left;
        let y = e.clientY - offsetY - container.getBoundingClientRect().top;
        x = Math.max(0, Math.min(x, container.clientWidth - newText.clientWidth));
        y = Math.max(0, Math.min(y, container.clientHeight - newText.clientHeight));
        newText.style.left = `${x}px`;
        newText.style.top = `${y}px`;
      });

      document.addEventListener('mouseup', () => isDragging = false);

      newText.addEventListener('touchstart', (e) => {
        isDragging = true;
        const touch = e.touches[0];
        offsetX = touch.clientX - newText.getBoundingClientRect().left;
        offsetY = touch.clientY - newText.getBoundingClientRect().top;
        newText.style.transform = 'none';
      });

      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const touch = e.touches[0];
        let x = touch.clientX - offsetX - container.getBoundingClientRect().left;
        let y = touch.clientY - offsetY - container.getBoundingClientRect().top;
        x = Math.max(0, Math.min(x, container.clientWidth - newText.clientWidth));
        y = Math.max(0, Math.min(y, container.clientHeight - newText.clientHeight));
        newText.style.left = `${x}px`;
        newText.style.top = `${y}px`;
      });

      document.addEventListener('touchend', () => isDragging = false);

      container.appendChild(newText);
      document.getElementById('memeTextInput').value = '';
    }

    window.publishMeme = async () => {
      const container = document.getElementById('memeContainer');
      const btn = document.getElementById('publishMemeBtn');
      if (!container.querySelector('img')) { alert('Загрузите картинку!'); return; }

      btn.innerText = 'Создание мема...'; btn.disabled = true;

      html2canvas(container, { useCORS: true, allowTaint: true, backgroundColor: null }).then(async (canvas) => {
        const base64Image = canvas.toDataURL('image/jpeg', 0.7);
        const nick = localStorage.getItem('myUsername');

        const { error } = await supabase.from('gossips').insert([{ 
          author: nick, 
          text: "Мем от @" + nick, 
          status: 'pending', 
          meme_base64: base64Image
        }]);

        if (error) { alert('Ошибка: ' + error.message); btn.innerText = 'Опубликовать мем 🚀'; btn.disabled = false; }
        else {
          btn.innerText = 'Мем на проверке! ✅'; btn.style.background = '#17a2b8';
          setTimeout(() => {
            btn.innerText = 'Опубликовать мем 🚀'; btn.style.background = '#28a745'; btn.disabled = false;
            openTab('gossips', document.querySelector('.nav-btn'));
          }, 2000);
        }
      });
    }

    // --- ОТПРАВКА СПЛЕТНИ (С ФОТО) ---
    window.previewImage = (input) => {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('fileLabel').innerText = '✅ Фото выбрано';
      }
    }

    window.sendMessage = async (event) => {
      event.preventDefault();
      const btn = document.getElementById('sendBtn');
      const text = document.getElementById('questionText').value;
      const myName = localStorage.getItem('myUsername');

      btn.innerText = 'Загрузка...'; btn.disabled = true;
      let imageUrl = null;

      if (selectedFile) {
        const fileExt = selectedFile.name.split('.').pop();
        const fileName = `gossip_${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabase.storage.from('images').upload(`public/${fileName}`, selectedFile);
        if (!uploadError) {
          const { data: urlData } = supabase.storage.from('images').getPublicUrl(`public/${fileName}`);
          imageUrl = urlData.publicUrl;
        }
      }

      btn.innerText = 'Отправка...';
      await supabase.from('gossips').insert([{ author: myName, text: text, status: 'pending', image_url: imageUrl }]);
      
      document.getElementById('questionText').value = '';
      selectedFile = null;
      document.getElementById('fileLabel').innerText = '📷 Прикрепить фото';
      
      btn.innerText = 'Отправлено! ✅'; btn.style.background = '#28a745';
      setTimeout(() => { btn.innerText = 'Отправить'; btn.style.background = ''; btn.disabled = false; openTab('gossips', document.querySelector('.nav-btn')); }, 1500);
    };

    // --- АДМИНКА ---
    window.openAdmin = () => {
      adminClicks++;
      if (adminClicks >= 5) {
        const pass = prompt('Пароль:');
        if (pass === '20120521s') {
          document.getElementById('adminTabBtn').style.display = 'block';
          openTab('admin', document.getElementById('adminTabBtn'));
          loadAdminData();
        }
        adminClicks = 0;
      }
    }

    window.switchAdminTab = async (tab) => {
      currentAdminView = tab;
      document.getElementById('btnAdminPending').classList.remove('active');
      document.getElementById('btnAdminChats').classList.remove('active');
      document.getElementById('btnAdminUsers').classList.remove('active');
      document.getElementById(tab === 'pending' ? 'btnAdminPending' : tab === 'chats' ? 'btnAdminChats' : 'btnAdminUsers').classList.add('active');
      loadAdminData();
    }

    async function loadAdminData() {
      const adminFeed = document.getElementById('adminFeed');
      
      if (currentAdminView === 'chats') {
        const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: false });
        adminFeed.innerHTML = (!data || data.length === 0) ? `<div class="empty-feed">Переписок нет</div>` : data.map(msg => `<div class="admin-chat-item"><strong>@${msg.sender_name}</strong> ➔ <strong>@${msg.receiver_name}</strong><br><span style="color:var(--text-muted);">${msg.text}</span></div>`).join('');
      
      } else if (currentAdminView === 'users') {
        const { data: profiles } = await supabase.from('profiles').select('*').order('username');
        adminFeed.innerHTML = (!profiles || profiles.length === 0) ? `<div class="empty-feed">Нет пользователей</div>` : profiles.map(p => `
          <div class="user-admin-item">
            <span>@${p.username}</span>
            <div>
              <input type="text" class="admin-input" id="input_user_${p.id}" value="${p.username}" maxlength="10">
              <button class="admin-save-btn" onclick="changeUserNickname('${p.id}')">Сохр.</button>
            </div>
          </div>
        `).join('');
      
      } else {
        const { data } = await supabase.from('gossips').select('*').eq('status', 'pending');
        adminFeed.innerHTML = (!data || data.length === 0) ? `<div class="empty-feed">Нет новых сплетен</div>` : data.map(g => `
          <div class="admin-chat-item">
            <strong>@${g.author}</strong><br>
            ${g.image_url ? `<img src="${g.image_url}" style="max-width:100%; border-radius:8px; margin-bottom:5px;">` : ''}
            ${g.meme_base64 ? `<img src="${g.meme_base64}" style="max-width:100%; border-radius:8px; margin-bottom:5px;">` : ''}
            <span style="color:var(--text-muted);">${g.text}</span>
            <button class="submit-btn" style="margin-top:5px; background:#28a745; padding:8px;" onclick="publishGossip('${g.id}')">✅ Опубликовать</button>
          </div>
        `).join('');
      }
    }

    window.changeUserNickname = async (userId) => {
      const newName = document.getElementById(`input_user_${userId}`).value.trim().toLowerCase();
      if (!/^[a-z0-9_]{1,10}$/.test(newName)) { alert('Только англ. строчные буквы, цифры и _ (до 10 символов)!'); return; }
      
      const { data: existingUser } = await supabase.from('profiles').select('id').ilike('username', newName).neq('id', userId);
      if (existingUser && existingUser.length > 0) { alert('Этот ник уже занят!'); return; }

      const { error } = await supabase.from('profiles').update({ username: newName }).eq('id', userId);
      if (!error) { alert('Ник изменен!'); loadAdminData(); }
      else { alert('Ошибка при смене ника.'); }
    }

    window.publishGossip = async (id) => {
      await supabase.from('gossips').update({ status: 'published' }).eq('id', id);
      loadAdminData();
    }

    window.openTab = (tabName, btn) => {
      let i, tabcontent = document.getElementsByClassName("tab-content");
      for (i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
      let tablinks = document.getElementsByClassName("nav-btn");
      for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
      document.getElementById(tabName).classList.add("active");
      if (btn) btn.classList.add("active");
      
      if (tabName === 'chatsList') {
        loadChats();
        document.getElementById('unreadBadge').style.display = 'none';
      }
    }

    window.onload = async () => {
      const bg = backgrounds[currentBgIndex];
      if (bg !== 'default') document.body.classList.add(bg);
      
      let fIdx = localStorage.getItem('fontIndex') || 0;
      if (fonts[fIdx] !== 'default') document.body.classList.add(fonts[fIdx]);
      
      await loadProfile();
      document.getElementById('newUsernameInput').value = localStorage.getItem('myUsername') || '';
      document.getElementById('newBioInput').value = localStorage.getItem('myBio') || '';
      
      loadGossips();
      subscribeToChanges();

      // Подключаем html2canvas для мемов
      const script = document.createElement('script');
      script.src = 'https://html2canvas.hertzen.com/dist/html2canvas.min.js';
      document.head.appendChild(script);
    };
  </script>
</body>
</html>
