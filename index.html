<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сплетни Марьяновской школы</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Comfortaa:wght@400;700&family=Marck+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fcf9f2; --dot-color: #f0e6d2; --card-bg: rgba(255, 255, 255, 0.85);
      --text-main: #4a3f35; --text-muted: #9c7e68; --accent: #ff9e7a; --accent-light: #ffd8b4; --border: rgba(240, 230, 210, 0.5);
      --font-main: 'Nunito', sans-serif;
      --shadow: 0 8px 32px 0 rgba(180, 160, 140, 0.15);
    }
    body.dark-theme {
      --bg-color: #121212; --dot-color: #1e1e1e; --card-bg: rgba(30, 30, 30, 0.85);
      --text-main: #e0e0e0; --text-muted: #888888; --accent: #ff8a5c; --accent-light: #3d2a20; --border: rgba(60, 60, 60, 0.5);
      --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
    }
    
    /* ФОНЫ */
    body.bg-stars { --bg-color: #0b0b1a; background-image: radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)); background-size: 200px 200px; }
    body.bg-matrix { --bg-color: #000; background-image: linear-gradient(180deg, rgba(0,255,0,0.15) 0%, transparent 10%, transparent 90%, rgba(0,255,0,0.15) 100%), linear-gradient(90deg, rgba(0,255,0,0.1) 1px, transparent 1px), linear-gradient(rgba(0,255,0,0.1) 1px, transparent 1px); background-size: 100% 100%, 30px 30px, 30px 30px; }
    body.bg-rain { --bg-color: #1a1a2e; background-image: repeating-linear-gradient(0deg, transparent, transparent 10px, rgba(255,255,255,0.08) 10px, rgba(255,255,255,0.08) 11px); }
    body.bg-snow { --bg-color: #e3f2fd; background-image: radial-gradient(circle, #fff 3px, transparent 4px), radial-gradient(circle, #fff 2px, transparent 3px); background-size: 60px 60px, 40px 40px; background-position: 0 0, 30px 30px; }
    body.bg-paper { --bg-color: #fdfbf7; background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px); background-size: 20px 20px; }
    body.bg-space { --bg-color: #000; background-image: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-main); background-color: var(--bg-color);
      color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      transition: background-color 0.5s ease, color 0.3s, font-family 0.3s;
    }
    
    .card, .gossip-card { 
      background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow); border: 1px solid var(--border);
    }

    button, .action-btn, .nav-btn { transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s; }
    button:active, .action-btn:active { transform: scale(0.92); }

    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: absolute; top: 0; left: 0; z-index: 10; }
    .online-badge { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 6px 12px; font-weight: 800; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; }
    .online-dot { width: 8px; height: 8px; background: #28a745; border-radius: 50%; box-shadow: 0 0 5px #28a745; }
    
    .controls { display: flex; gap: 10px; }
    .icon-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .site-header { text-align: center; padding: 70px 20px 20px; z-index: 2; width: 100%; cursor: pointer; user-select: none; }
    .site-header h1 { font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 25px; background: var(--card-bg); padding: 8px; border-radius: 20px; border: 2px solid var(--border); flex-wrap: wrap; justify-content: center; width: 90%; max-width: 480px; }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 800; padding: 10px 10px; border-radius: 14px; cursor: pointer; flex: 1; }
    .nav-btn.active { background: var(--accent-light); color: var(--text-main); }
    #adminTabBtn { display: none; background: #ff4d4d; color: white; }

    .card { border-radius: 24px; padding: 25px 20px; max-width: 480px; width: 90%; margin-bottom: 40px; }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    .gossip-card { border-radius: 16px; text-align: left; overflow: hidden; display: flex; flex-direction: column; margin-bottom: 20px; }
    .gossip-content { padding: 15px; }
    .gossip-author-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .author-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; border: 2px solid var(--accent); }
    .gossip-author { font-size: 0.85rem; font-weight: 800; color: var(--accent); }
    .gossip-text { font-size: 1rem; line-height: 1.5; color: var(--text-main); font-weight: 600; margin-bottom: 15px; }
    
    .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .action-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 0.9rem; font-weight: 800; color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .action-btn.liked { background: #d4edda; border-color: #28a745; color: #155724; }
    
    /* Комментарии */
    .comments-section { margin-top: 15px; border-top: 2px dashed var(--border); padding-top: 10px; }
    .comment { background: rgba(0,0,0,0.05); padding: 8px 12px; border-radius: 12px; margin-bottom: 8px; font-size: 0.9rem; border: 1px solid var(--border); }
    .comment-author { font-weight: 800; color: var(--accent); font-size: 0.8rem; }
    .comment-input-row { display: flex; gap: 5px; margin-top: 10px; }
    .comment-input { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-main); outline: none; }
    .comment-btn { background: var(--accent); border: none; color: white; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }

    /* Профиль и Мессенджер */
    .profile-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
    .profile-cover { width: 100%; height: 120px; background: var(--accent-light); border-radius: 16px; margin-bottom: -40px; background-size: cover; background-position: center; position: relative; }
    .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--card-bg); border: 4px solid var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 2rem; position: relative; z-index: 2; }
    .profile-info { text-align: center; margin-top: 10px; }
    .profile-username { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }
    .profile-bio { font-size: 0.9rem; color: var(--text-muted); }
    
    .achievements-list { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; }
    .achievement-badge { background: gold; color: #000; padding: 4px 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; }

    .chat-container { display: flex; flex-direction: column; height: 400px; background: var(--bg-color); border-radius: 16px; border: 2px solid var(--border); overflow: hidden; }
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 12px; font-size: 0.9rem; }
    .msg.me { background: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 0; }
    .msg.them { background: var(--card-bg); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 0; border: 1px solid var(--border); }
    .chat-input-row { display: flex; padding: 10px; background: var(--card-bg); border-top: 1px solid var(--border); gap: 10px; }
    .chat-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); outline: none; }

    .submit-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; width: 100%; }
    
    /* Остальные стили */
    .question-form { display: flex; flex-direction: column; gap: 12px; }
    .question-form textarea { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--card-bg); color: var(--text-main); font-family: inherit; font-size: 1rem; min-height: 100px; }
    .empty-feed { text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--card-bg); border-radius: 16px; border: 2px dashed var(--border); }
    footer { text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); padding-bottom: 20px; }
    
    .admin-nav { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .admin-nav button { flex: 1; padding: 10px; border: none; border-radius: 10px; background: var(--card-bg); color: var(--text-main); font-weight: bold; cursor: pointer; border: 2px solid var(--border); font-size: 0.8rem; }
    .admin-nav button.active { background: var(--accent); color: white; }
    .admin-card { background: #fff3cd; } .admin-card.published-card { background: #d4edda; } .admin-card.deleted-card { background: #f8d7da; opacity: 0.8; }
    .admin-btn { background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    .delete-btn { background: #dc3545; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="online-badge"><div class="online-dot"></div><span id="onlineCount">...</span> онлайн</div>
    <div class="controls">
      <button class="icon-btn" onclick="cycleBackground()" id="bgBtn" title="Сменить фон">🌌</button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
      <button class="icon-btn" onclick="showQR()" title="QR-код">📱</button>
    </div>
  </div>
  
  <header class="site-header" onclick="openAdmin()">
    <h1>Сплетни Марьяновской школы</h1>
    <p>Только свежие новости 🤫</p>
  </header>

  <div class="nav-tabs">
    <button class="nav-btn active" onclick="openTab('gossips', this)">📰 Лента</button>
    <button class="nav-btn" onclick="openTab('messenger', this)">💬 Мессенджер</button>
    <button class="nav-btn" onclick="openTab('profile', this)">👤 Профиль</button>
    <button class="nav-btn" onclick="openTab('memes', this)">🖼️ Мемы</button>
    <button class="nav-btn" onclick="openTab('suggest', this)">📝 Предложить</button>
    <button class="nav-btn" id="adminTabBtn" onclick="openTab('admin', this)">🛠️ Админка</button>
  </div>

  <main class="card">
    <div id="gossips" class="tab-content active">
      <div class="feed-container" id="mainFeed"></div>
    </div>

    <!-- МЕССЕНДЖЕР -->
    <div id="messenger" class="tab-content">
      <h3 style="margin-bottom: 15px;">Мессенджер 💬</h3>
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="empty-feed">Выбери друга в профиле, чтобы написать ему</div>
        </div>
        <div class="chat-input-row">
          <input type="text" class="chat-input" id="chatInput" placeholder="Написать сообщение...">
          <button class="comment-btn" onclick="sendMessageToUser()">➤</button>
        </div>
      </div>
      <p style="text-align: center; font-size: 0.8rem; margin-top: 10px; color: var(--text-muted);">Кому пишем: <strong id="chatTargetName">Никто</strong></p>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="profile" class="tab-content">
      <div class="profile-header">
        <div class="profile-cover" id="profileCover"></div>
        <div class="profile-avatar" id="profileAvatar">🦊</div>
        <div class="profile-info">
          <div class="profile-username" id="profileUsername">@гость</div>
          <div class="profile-bio" id="profileBio">Тут будет твое био</div>
          <div class="achievements-list" id="profileAchievements"></div>
        </div>
      </div>
      
      <div class="question-form">
        <label>Сменить юзернейм</label>
        <input type="text" id="newUsernameInput" placeholder="@username" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        
        <label>Сменить био</label>
        <input type="text" id="newBioInput" placeholder="О себе" style="padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        
        <label>Обои профиля (картинка)</label>
        <input type="file" id="coverInput" accept="image/*" onchange="uploadCover(this)">
        
        <button class="submit-btn" onclick="saveProfile()">Сохранить профиль</button>
      </div>
    </div>

    <div id="memes" class="tab-content">
      <h3 style="margin-bottom: 15px; text-align: center;">Генератор мемов 😂</h3>
      <div class="question-form">
        <input type="file" id="memeImageInput" accept="image/*" onchange="loadMemeImage(this)" style="margin-bottom: 10px;">
        <input type="text" id="memeTextInput" placeholder="Введи текст..." style="padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
        <button class="submit-btn" onclick="addTextToMeme()" style="background: #4facfe;">Добавить текст</button>
        <div class="meme-container" id="memeContainer" style="display:none; position: relative; width: 100%; margin-bottom: 15px; overflow: hidden; border-radius: 10px;">
          <img id="memeImage" src="" crossorigin="anonymous" style="width: 100%; display: block;">
        </div>
        <button class="submit-btn" onclick="publishMeme()" id="publishMemeBtn" style="display: none; background: #28a745;">Опубликовать мем 🚀</button>
      </div>
    </div>

    <div id="suggest" class="tab-content">
      <form class="question-form" id="tgForm" onsubmit="sendMessage(event)">
        <textarea id="questionText" placeholder="Напиши свою сплетню..." required></textarea>
        <button type="submit" class="submit-btn" id="sendBtn">Отправить</button>
      </form>
    </div>

    <div id="admin" class="tab-content">
      <div class="admin-nav">
        <button id="btnAdminPending" class="active" onclick="switchAdminTab('pending')">На проверку</button>
        <button id="btnAdminPublished" onclick="switchAdminTab('published')">Опубликованные</button>
      </div>
      <div class="feed-container" id="adminFeed"></div>
    </div>
  </main>
  <footer>© 2026 Сплетни Марьяновской школы</footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://owcxvgvajlbrpirwvjhr.supabase.co', 'sb_publishable_ML7qbFIVKcg4z_lD8Gr0CQ_wh611unv');

    let allGossips = [], allComments = [], myProfile = null;
    let currentChatTarget = null;
    let adminClicks = 0;
    let currentBgIndex = localStorage.getItem('bgIndex') || 0;

    // Доступные фоны
    const backgrounds = ['default', 'bg-stars', 'bg-matrix', 'bg-rain', 'bg-snow', 'bg-paper', 'bg-space'];
    
    window.cycleBackground = () => {
      currentBgIndex = (parseInt(currentBgIndex) + 1) % backgrounds.length;
      localStorage.setItem('bgIndex', currentBgIndex);
      document.body.className = document.body.className.replace(/bg-\S+/g, '').trim();
      const bg = backgrounds[currentBgIndex];
      if (bg !== 'default') document.body.classList.add(bg);
    }

    window.toggleTheme = () => {
      document.body.classList.toggle('dark-theme');
      document.getElementById('themeBtn').innerText = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
    }

    window.showQR = () => {
      alert('QR-код для быстрого перехода на сайт: [Здесь будет QR]');
    }

    // Авто-тема (30)
    function autoTheme() {
      const hour = new Date().getHours();
      if (hour >= 20 || hour < 7) {
        document.body.classList.add('dark-theme');
        document.getElementById('themeBtn').innerText = '☀️';
      }
    }

    // --- ПРОФИЛЬ ---
    window.saveProfile = async () => {
      const uname = document.getElementById('newUsernameInput').value.trim();
      const bio = document.getElementById('newBioInput').value.trim();
      if (!uname) return alert('Введи юзернейм!');

      const { error } = await supabase.from('profiles').upsert({
        username: uname,
        bio: bio,
        cover_url: localStorage.getItem('profileCover')
      }, { onConflict: 'username' });

      if (!error) {
        localStorage.setItem('myUsername', uname);
        localStorage.setItem('myBio', bio);
        loadProfile();
        alert('Профиль сохранен!');
      }
    }

    window.uploadCover = async (input) => {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const base64 = e.target.result;
          localStorage.setItem('profileCover', base64);
          document.getElementById('profileCover').style.backgroundImage = `url(${base64})`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function loadProfile() {
      const savedUname = localStorage.getItem('myUsername') || 'Гость';
      const savedBio = localStorage.getItem('myBio') || 'Тут будет твое био';
      const savedCover = localStorage.getItem('profileCover');

      document.getElementById('profileUsername').innerText = `@${savedUname}`;
      document.getElementById('profileBio').innerText = savedBio;
      if (savedCover) document.getElementById('profileCover').style.backgroundImage = `url(${savedCover})`;

      // Выдаем ачивки (5)
      const achHTML = [];
      const hour = new Date().getHours();
      if (hour >= 0 && hour < 6) achHTML.push('<span class="achievement-badge">🦉 Ночной житель</span>');
      if (allGossips.some(g => g.author.includes(savedUname))) achHTML.push('<span class="achievement-badge">📝 Первая сплетня</span>');
      
      document.getElementById('profileAchievements').innerHTML = achHTML.join('');
    }

    // --- МЕССЕНДЖЕР ---
    window.openChat = (username) => {
      currentChatTarget = username;
      document.getElementById('chatTargetName').innerText = username;
      openTab('messenger', document.querySelectorAll('.nav-btn')[1]);
      loadMessages();
    }

    async function loadMessages() {
      if (!currentChatTarget) return;
      const myName = localStorage.getItem('myUsername') || 'Гость';

      // Загружаем сообщения между мной и target
      const { data } = await supabase.from('messages')
        .select('*')
        .or(`and(sender_name.eq.${myName},receiver_name.eq.${currentChatTarget}),and(sender_name.eq.${currentChatTarget},receiver_name.eq.${myName})`)
        .order('created_at', { ascending: true });

      const chatBox = document.getElementById('chatMessages');
      if (!data || data.length === 0) {
        chatBox.innerHTML = `<div class="empty-feed">Начни диалог с ${currentChatTarget}</div>`;
      } else {
        chatBox.innerHTML = data.map(msg => `
          <div class="msg ${msg.sender_name === myName ? 'me' : 'them'}">
            ${msg.sender_name !== myName ? `<div style="font-size:0.7rem;opacity:0.7;">${msg.sender_name}</div>` : ''}
            ${msg.text}
          </div>
        `).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    window.sendMessageToUser = async () => {
      if (!currentChatTarget) return alert('Выбери собеседника!');
      const input = document.getElementById('chatInput');
      const myName = localStorage.getItem('myUsername') || 'Гость';

      await supabase.from('messages').insert([{
        sender_name: myName,
        receiver_name: currentChatTarget,
        text: input.value
      }]);

      input.value = '';
      loadMessages();
    }

    // --- ОСТАЛЬНОЕ ---
    async function loadData() {
      const { data: gData } = await supabase.from('gossips').select('*').order('id', { ascending: false });
      allGossips = gData || [];
      renderFeeds();
      loadProfile();
    }

    // ... (Функции мемов, лайков, админки оставляем как были) ...
    // Для краткости я не дублирую код админки и мемов, он остается тем же, что и в прошлом ответе.

    window.openTab = (tabName, btn) => {
      let i, tabcontent = document.getElementsByClassName("tab-content");
      for (i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
      let tablinks = document.getElementsByClassName("nav-btn");
      for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
      document.getElementById(tabName).classList.add("active");
      if (btn) btn.classList.add("active");
    }

    window.onload = () => {
      autoTheme();
      loadData();
      document.getElementById('newUsernameInput').value = localStorage.getItem('myUsername') || '';
      document.getElementById('newBioInput').value = localStorage.getItem('myBio') || '';
    };
  </script>
</body>
</html>
