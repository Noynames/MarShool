<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сплетни Марьяновской школы</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #fcf9f2; --dot-color: #f0e6d2; --card-bg: #ffffff;
      --text-main: #4a3f35; --text-muted: #9c7e68; --accent: #ff9e7a; --accent-light: #ffd8b4; --border: #f0e6d2;
    }
    body.dark-theme {
      --bg-color: #1a1a1a; --dot-color: #2a2a2a; --card-bg: #242424;
      --text-main: #e0e0e0; --text-muted: #999999; --accent: #ff8a5c; --accent-light: #3d2a20; --border: #333333;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif; background-color: var(--bg-color);
      background-image: radial-gradient(var(--dot-color) 2px, transparent 2px); background-size: 30px 30px;
      color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      transition: background-color 1s ease, color 0.3s;
    }
    
    .top-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; position: absolute; top: 0; left: 0; }
    .online-badge { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 6px 12px; font-weight: 800; font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
    .online-dot { width: 8px; height: 8px; background: #28a745; border-radius: 50%; box-shadow: 0 0 5px #28a745; }
    .theme-toggle { background: var(--card-bg); border: 2px solid var(--border); border-radius: 50%; width: 40px; height: 40px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .site-header { text-align: center; padding: 70px 20px 20px; z-index: 2; width: 100%; cursor: pointer; user-select: none; }
    .site-header h1 { font-size: 2rem; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    .site-header p { font-size: 1rem; color: var(--text-muted); font-weight: 600; }
    
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 25px; background: var(--card-bg); padding: 8px; border-radius: 20px; border: 2px solid var(--border); flex-wrap: wrap; justify-content: center; width: 90%; max-width: 480px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.85rem; font-weight: 800; padding: 10px 10px; border-radius: 14px; cursor: pointer; transition: all 0.3s ease; flex: 1; }
    .nav-btn.active { background: var(--accent-light); color: var(--text-main); }
    #adminTabBtn { display: none; background: #ff4d4d; color: white; }

    .card { background: var(--card-bg); border-radius: 24px; padding: 25px 20px; max-width: 480px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 2px solid var(--border); margin-bottom: 40px; }
    .tab-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    .skeleton-card { background: var(--bg-color); border-radius: 16px; border: 2px solid var(--border); padding: 15px; margin-bottom: 20px; }
    .skeleton-line { height: 15px; background: var(--border); border-radius: 5px; margin-bottom: 10px; animation: pulse 1.5s infinite; }
    .skeleton-line.short { width: 50%; }
    .skeleton-img { height: 150px; background: var(--border); border-radius: 10px; margin-bottom: 15px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

    .feed-container { display: flex; flex-direction: column; gap: 20px; }
    .gossip-card {
      background: var(--bg-color); border-radius: 16px; border: 2px solid var(--border);
      text-align: left; overflow: hidden; display: flex; flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .gossip-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    
    .gossip-image { width: 100%; max-height: 300px; object-fit: cover; border-bottom: 2px solid var(--border); }
    .gossip-content { padding: 15px; }
    .gossip-author { font-size: 0.85rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .gossip-text { font-size: 1rem; line-height: 1.5; color: var(--text-main); font-weight: 600; margin-bottom: 15px; }
    
    .spoiler { background: var(--text-main); color: transparent; padding: 0 4px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
    .spoiler.revealed { background: transparent; color: var(--text-main); }

    .action-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .action-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 0.9rem; font-weight: 800; color: var(--text-muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s ease; font-family: inherit; }
    .action-btn.liked { background: #d4edda; border-color: #28a745; color: #155724; cursor: not-allowed; }
    .action-btn.disliked { background: #f8d7da; border-color: #dc3545; color: #721c24; cursor: not-allowed; }

    .emoji-reactions { display: flex; gap: 8px; flex-wrap: wrap; }
    .emoji-btn { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 6px 10px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: transform 0.1s; }
    .emoji-btn.reacted { background: var(--accent-light); border-color: var(--accent); cursor: not-allowed; }
    .emoji-count { font-size: 0.85rem; font-weight: 800; color: var(--text-main); }

    /* Стили для опросов */
    .poll-box { background: var(--card-bg); padding: 12px; border-radius: 12px; margin-bottom: 10px; border: 2px solid var(--border); }
    .poll-title { font-weight: 800; margin-bottom: 10px; font-size: 0.95rem; }
    .poll-option { display: block; width: 100%; text-align: left; background: var(--bg-color); border: 1px solid var(--border); padding: 8px 12px; margin-bottom: 6px; border-radius: 8px; cursor: pointer; font-weight: 700; transition: 0.2s; }
    .poll-option:hover { background: var(--accent-light); }
    .poll-results { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    .question-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .nick-container { background: var(--accent-light); padding: 12px; border-radius: 12px; font-size: 0.9rem; border: 2px dashed var(--accent); margin-bottom: 5px; color: var(--text-main); font-weight: 600; display: flex; flex-direction: column; gap: 8px; }
    .nick-row { display: flex; justify-content: space-between; align-items: center; }
    .edit-nick-btn { background: var(--accent); color: white; border: none; padding: 4px 10px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 0.75rem; }
    
    .question-form textarea { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid var(--border); background: var(--bg-color); color: var(--text-main); font-family: inherit; font-size: 1rem; resize: vertical; min-height: 100px; outline: none; }
    
    .file-upload-wrapper { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
    .file-label { background: var(--card-bg); border: 2px dashed var(--border); padding: 10px; border-radius: 10px; font-weight: 700; color: var(--text-muted); cursor: pointer; text-align: center; flex: 1; }
    #imageInput { display: none; }

    .submit-btn { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 12px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
    footer { text-align: center; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; padding-bottom: 20px; }
    
    .admin-nav { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .admin-nav button { flex: 1; padding: 10px; border: none; border-radius: 10px; background: var(--card-bg); color: var(--text-main); font-weight: bold; cursor: pointer; border: 2px solid var(--border); font-size: 0.8rem; }
    .admin-nav button.active { background: var(--accent); color: white; border-color: var(--accent); }
    .admin-card { background: #fff3cd; border-color: #ffc107; }
    .admin-card.published-card { background: #d4edda; border-color: #28a745; }
    .admin-card.deleted-card { background: #f8d7da; border-color: #dc3545; opacity: 0.8; }
    .admin-btn { background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    .delete-btn { background: #dc3545; margin-top: 5px; }
    .restore-btn { background: #17a2b8; margin-top: 5px; }

    .rating-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid var(--border); font-weight: 700; }
    .badge { background: #e0f7fa; color: #006064; padding: 2px 6px; border-radius: 8px; font-size: 0.65rem; font-weight: 800; }
    .search-input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 10px; border: 2px solid var(--border); background: var(--bg-color); color: var(--text-main); outline: none; }
  </style>
</head>
<body>
  
  <div class="top-bar">
    <div class="online-badge"><div class="online-dot"></div><span id="onlineCount">...</span> онлайн</div>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>
  
  <header class="site-header" onclick="openAdmin()">
    <h1>Сплетни Марьяновской школы</h1>
    <p>Только свежие новости 🤫</p>
  </header>

  <div class="nav-tabs">
    <button class="nav-btn active" onclick="openTab('gossips', this)">📰 Лента</button>
    <button class="nav-btn" onclick="openTab('rating', this)">👑 Топ-10</button>
    <button class="nav-btn" onclick="openTab('suggest', this)">📝 Предложить</button>
    <button class="nav-btn" id="adminTabBtn" onclick="openTab('admin', this)">🛠️ Админка</button>
  </div>

  <main class="card">
    <div id="gossips" class="tab-content active">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Поиск по сплетням..." oninput="filterGossips()">
      <div class="feed-container" id="mainFeed"></div>
      <div id="loadMoreBtn" style="text-align: center; margin-top: 20px; display: none;">
        <button class="action-btn" onclick="loadMore()">Показать еще</button>
      </div>
    </div>
    
    <div id="rating" class="tab-content">
      <h3 style="margin-bottom: 15px; text-align: center;">Топ-10 анонимов</h3>
      <div id="topAuthors"></div>
      <h3 style="margin-top: 25px; margin-bottom: 15px; text-align: center;">Доска почета классов</h3>
      <div id="classBoard"></div>
    </div>

    <div id="suggest" class="tab-content">
      <form class="question-form" id="tgForm" onsubmit="sendMessage(event)">
        <div class="nick-container">
          <div class="nick-row">Твой ник: <strong id="nickname">Гость_0000</strong> <button type="button" class="edit-nick-btn" onclick="editNick()">Изменить</button></div>
          <input type="text" id="classInput" class="search-input" style="margin:0; padding: 8px;" placeholder="Твой класс (например, 10А)">
        </div>
        
        <textarea id="questionText" placeholder="Напиши свою сплетню (используй ||, чтобы скрыть текст под спойлер)..." oninput="saveDraft()"></textarea>
        
        <div class="file-upload-wrapper">
          <label for="imageInput" class="file-label" id="fileLabel">📷 Прикрепить фото</label>
          <input type="file" id="imageInput" accept="image/*" onchange="previewImage(this)">
        </div>

        <div style="margin-bottom: 10px;">
          <label style="font-weight: 800; font-size: 0.9rem; margin-bottom: 5px; display: block;">Прикрепить опрос (необязательно)</label>
          <input type="text" id="pollQuestion" class="search-input" style="margin-bottom: 5px;" placeholder="Вопрос (например: Кто круче?)">
          <div style="display: flex; gap: 5px;">
            <input type="text" id="pollA" class="search-input" style="margin: 0;" placeholder="Вариант А">
            <input type="text" id="pollB" class="search-input" style="margin: 0;" placeholder="Вариант Б">
          </div>
        </div>

        <button type="submit" class="submit-btn" id="sendBtn">Отправить</button>
      </form>
    </div>

    <div id="admin" class="tab-content">
      <div class="admin-nav">
        <button id="btnAdminPending" class="active" onclick="switchAdminTab('pending')">На проверку</button>
        <button id="btnAdminPublished" onclick="switchAdminTab('published')">Опубликованные</button>
        <button id="btnAdminDeleted" onclick="switchAdminTab('deleted')">Корзина</button>
      </div>
      <div class="feed-container" id="adminFeed"></div>
    </div>
  </main>
  <footer>© 2026 Сплетни Марьяновской школы</footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const supabase = createClient('https://owcxvgvajlbrpirwvjhr.supabase.co', 'sb_publishable_ML7qbFIVKcg4z_lD8Gr0CQ_wh611unv');

    let allGossips = [];
    let allPolls = [];
    let displayedGossips = []; // Для скролла
    let currentAdminView = 'pending';
    let selectedFile = null;
    let adminClicks = 0;
    let currentUserId = localStorage.getItem('siteUserId') || Math.random().toString(36).substring(2, 15);
    
    // Параметры бесконечного скролла
    let page = 0;
    const pageSize = 5;

    const ADMIN_PASSWORD = '20120521s';
    const ADMIN_ANSWER = '2012';

    function autoTheme() {
      const hour = new Date().getHours();
      if (hour >= 20 || hour < 7) {
        document.body.classList.add('dark-theme');
        document.getElementById('themeBtn').innerText = '☀️';
      }
    }

    window.toggleTheme = () => {
      document.body.classList.toggle('dark-theme');
      document.getElementById('themeBtn').innerText = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
    }

    function generateNick() {
      const savedNick = localStorage.getItem('userNickname');
      if (savedNick) {
        document.getElementById('nickname').innerText = savedNick;
        document.getElementById('classInput').value = localStorage.getItem('userClass') || '';
      } else {
        const newNick = `🦊 Гость_${Math.floor(100 + Math.random() * 900)}`;
        document.getElementById('nickname').innerText = newNick;
        localStorage.setItem('userNickname', newNick);
      }
    }

    window.editNick = () => {
      const newNick = prompt('Введи свой ник (макс. 15 символов):', document.getElementById('nickname').innerText);
      if (newNick && newNick.trim() !== '') {
        let cleanNick = newNick.trim().substring(0, 15);
        document.getElementById('nickname').innerText = cleanNick;
        localStorage.setItem('userNickname', cleanNick);
      }
    }

    window.saveDraft = () => {
      localStorage.setItem('draftText', document.getElementById('questionText').value);
    }
    
    const draft = localStorage.getItem('draftText');
    if (draft) document.getElementById('questionText').value = draft;

    window.previewImage = (input) => {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('fileLabel').innerText = '✅ Фото выбрано';
      }
    }

    async function updateOnlineStatus() {
      await supabase.from('online_users').upsert({ id: currentUserId, last_seen: new Date().toISOString() });
      const { count } = await supabase.from('online_users').select('*', { count: 'exact', head: true }).gt('last_seen', new Date(Date.now() - 2 * 60000).toISOString());
      if (count !== null) document.getElementById('onlineCount').innerText = count;
    }
    setInterval(updateOnlineStatus, 30000);

    async function loadData() {
      // Загружаем сплетни
      const { data: gData, error: gError } = await supabase.from('gossips').select('*').order('is_top', { ascending: false }).order('id', { ascending: false });
      if (gError) return;
      allGossips = gData || [];

      // Загружаем опросы
      const { data: pData } = await supabase.from('polls').select('*');
      allPolls = pData || [];

      // Сбрасываем пагинацию и рендерим
      page = 0;
      displayedGossips = [];
      document.getElementById('mainFeed').innerHTML = '';
      loadMore(); // Загружаем первую порцию
      
      renderAdminFeed();
      renderRatings();
    }

    // Бесконечный скролл / Кнопка "Показать еще"
    window.loadMore = async () => {
      const published = allGossips.filter(g => g.status === 'published');
      const nextGossips = published.slice(page * pageSize, (page + 1) * pageSize);
      
      if (nextGossips.length === 0 && page > 0) {
        document.getElementById('loadMoreBtn').style.display = 'none';
        return;
      }

      const feed = document.getElementById('mainFeed');
      nextGossips.forEach(g => {
        feed.insertAdjacentHTML('beforeend', renderCard(g));
      });

      page++;
      if (page * pageSize < published.length) {
        document.getElementById('loadMoreBtn').style.display = 'block';
      } else {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
    }

    window.sendMessage = async (event) => {
      event.preventDefault();
      const btn = document.getElementById('sendBtn');
      const textValue = document.getElementById('questionText').value;
      const nick = document.getElementById('nickname').innerText;
      const userClass = document.getElementById('classInput').value;
      
      const pollQ = document.getElementById('pollQuestion').value;
      const pollA = document.getElementById('pollA').value;
      const pollB = document.getElementById('pollB').value;

      if (!textValue && !pollQ) {
        alert('Напиши текст или создай опрос!');
        return;
      }

      localStorage.setItem('userClass', userClass);
      btn.innerText = 'Отправка...'; btn.disabled = true;
      let imageUrl = null;

      if (selectedFile) {
        const fileExt = selectedFile.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const { error: uploadError } = await supabase.storage.from('images').upload(`public/${fileName}`, selectedFile);
        if (!uploadError) {
          const { data: urlData } = supabase.storage.from('images').getPublicUrl(`public/${fileName}`);
          imageUrl = urlData.publicUrl;
        }
      }

      const { error } = await supabase.from('gossips').insert([{ 
        author: nick, emoji: '🦊', text: textValue, author_class: userClass, likes: 0, dislikes: 0, status: 'pending', image_url: imageUrl 
      }]);

      if (pollQ && pollA && pollB) {
        await supabase.from('polls').insert([{ question: pollQ, option_a: pollA, option_b: pollB }]);
      }

      if (error) {
        alert('Ошибка: ' + error.message);
        btn.innerText = 'Отправить'; btn.disabled = false;
      } else {
        localStorage.removeItem('draftText');
        document.getElementById('questionText').value = '';
        document.getElementById('pollQuestion').value = '';
        document.getElementById('pollA').value = '';
        document.getElementById('pollB').value = '';
        
        btn.innerText = 'Отправлено! ✅'; btn.style.background = '#28a745';
        loadData();
        setTimeout(() => { 
          btn.innerText = 'Отправить'; btn.style.background = ''; btn.disabled = false; 
          openTab('gossips', document.querySelector('.nav-btn'));
        }, 1500);
      }
    };

    window.reactEmoji = async (id, type) => {
      if (localStorage.getItem(`voted_${id}_${type}`)) return;
      const gossip = allGossips.find(g => g.id === id);
      if (gossip) {
        let reactions = gossip.reactions || {};
        reactions[type] = (reactions[type] || 0) + 1;
        await supabase.from('gossips').update({ reactions }).eq('id', id);
        localStorage.setItem(`voted_${id}_${type}`, 'true');
        loadData();
      }
    }

    window.likeGossip = async (id) => {
      if (localStorage.getItem(`voted_${id}_like`) || localStorage.getItem(`voted_${id}_dislike`)) return;
      const gossip = allGossips.find(g => g.id === id);
      if (gossip) {
        await supabase.from('gossips').update({ likes: (gossip.likes || 0) + 1 }).eq('id', id);
        localStorage.setItem(`voted_${id}_like`, 'true');
        loadData();
      }
    }

    window.dislikeGossip = async (id) => {
      if (localStorage.getItem(`voted_${id}_like`) || localStorage.getItem(`voted_${id}_dislike`)) return;
      const gossip = allGossips.find(g => g.id === id);
      if (gossip) {
        await supabase.from('gossips').update({ dislikes: (gossip.dislikes || 0) + 1 }).eq('id', id);
        localStorage.setItem(`voted_${id}_dislike`, 'true');
        loadData();
      }
    }

    // Восстановление из корзины
    window.deleteGossip = async (id) => {
      if(confirm('Переместить в корзину?')) {
        await supabase.from('gossips').update({ is_deleted: true }).eq('id', id);
        loadData();
      }
    }

    window.restoreGossip = async (id) => {
      await supabase.from('gossips').update({ is_deleted: false }).eq('id', id);
      loadData();
    }

    window.publishGossip = async (id) => {
      await supabase.from('gossips').update({ status: 'published' }).eq('id', id);
      loadData();
    }

    window.switchAdminTab = (tab) => {
      currentAdminView = tab;
      document.getElementById('btnAdminPending').classList.remove('active');
      document.getElementById('btnAdminPublished').classList.remove('active');
      document.getElementById('btnAdminDeleted').classList.remove('active');
      document.getElementById('btnAdmin' + (tab === 'pending' ? 'Pending' : tab === 'published' ? 'Published' : 'Deleted')).classList.add('active');
      renderAdminFeed();
    }

    window.openAdmin = () => {
      adminClicks++;
      if (adminClicks >= 5) {
        const pass = prompt('Пароль:');
        if (pass === ADMIN_PASSWORD) {
          const answer = prompt('Год рождения:');
          if (answer === ADMIN_ANSWER) {
            document.getElementById('adminTabBtn').style.display = 'block';
            alert('Админка разблокирована!');
            openTab('admin', document.getElementById('adminTabBtn'));
          } else alert('Неверный год!');
        } else if (pass !== null) alert('Неверный пароль!');
        adminClicks = 0;
      }
    }

    window.filterGossips = () => {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('#mainFeed .gossip-card');
      cards.forEach(card => {
        const text = card.querySelector('.gossip-text').innerText.toLowerCase();
        card.style.display = text.includes(query) ? 'flex' : 'none';
      });
    }

    function renderRatings() {
      const published = allGossips.filter(g => g.status === 'published');
      const authors = {};
      const classes = {};
      
      published.forEach(g => {
        authors[g.author] = (authors[g.author] || 0) + 1;
        if (g.author_class) classes[g.author_class] = (classes[g.author_class] || 0) + 1;
      });

      const topAuthors = Object.entries(authors).sort((a, b) => b[1] - a[1]).slice(0, 10);
      document.getElementById('topAuthors').innerHTML = topAuthors.map((a, i) => `
        <div class="rating-item"><span>${i+1}. ${a[0]}</span> <span>${a[1]} сплетен</span></div>
      `).join('') || '<div class="empty-feed">Пусто</div>';

      const topClasses = Object.entries(classes).sort((a, b) => b[1] - a[1]).slice(0, 5);
      document.getElementById('classBoard').innerHTML = topClasses.map((c, i) => `
        <div class="rating-item"><span>${i+1}. Класс ${c[0]}</span> <span>${c[1]} сплетен</span></div>
      `).join('') || '<div class="empty-feed">Пусто</div>';
    }

    function renderAdminFeed() {
      const pending = allGossips.filter(g => g.status === 'pending' && !g.is_deleted);
      const published = allGossips.filter(g => g.status === 'published' && !g.is_deleted);
      const deleted = allGossips.filter(g => g.is_deleted);
      
      const adminFeed = document.getElementById('adminFeed');

      if (currentAdminView === 'pending') {
        if (pending.length === 0) adminFeed.innerHTML = `<div class="empty-feed">Нет новых</div>`;
        else adminFeed.innerHTML = pending.map(g => `
            <div class="gossip-card admin-card">
              ${g.image_url ? `<img src="${g.image_url}" class="gossip-image">` : ''}
              <div class="gossip-content">
                <div class="gossip-author">${g.author} ${g.author_class ? `(${g.author_class})` : ''}</div>
                <div class="gossip-text">${g.text}</div>
                <button class="admin-btn" onclick="publishGossip('${g.id}')">✅ Опубликовать</button>
                <button class="admin-btn delete-btn" onclick="deleteGossip('${g.id}')">❌ В корзину</button>
              </div>
            </div>
          `).join('');
      } else if (currentAdminView === 'published') {
        if (published.length === 0) adminFeed.innerHTML = `<div class="empty-feed">Пусто</div>`;
        else adminFeed.innerHTML = published.map(g => `
            <div class="gossip-card published-card">
              ${g.image_url ? `<img src="${g.image_url}" class="gossip-image">` : ''}
              <div class="gossip-content">
                <div class="gossip-author">${g.author}</div>
                <div class="gossip-text">${g.text}</div>
                <button class="admin-btn delete-btn" onclick="deleteGossip('${g.id}')">❌ В корзину</button>
              </div>
            </div>
          `).join('');
      } else {
        if (deleted.length === 0) adminFeed.innerHTML = `<div class="empty-feed">Корзина пуста</div>`;
        else adminFeed.innerHTML = deleted.map(g => `
            <div class="gossip-card deleted-card">
              <div class="gossip-content">
                <div class="gossip-author">${g.author}</div>
                <div class="gossip-text">${g.text}</div>
                <button class="admin-btn restore-btn" onclick="restoreGossip('${g.id}')">♻️ Восстановить</button>
              </div>
            </div>
          `).join('');
      }
    }

    function renderCard(gossip) {
      const liked = localStorage.getItem(`voted_${gossip.id}_like`) === 'true';
      const disliked = localStorage.getItem(`voted_${gossip.id}_dislike`) === 'true';
      const reactions = gossip.reactions || {};
      
      let displayText = gossip.text.replace(/\|\|(.*?)\|\|/g, (match, p1) => {
        return `<span class="spoiler" onclick="this.classList.toggle('revealed')">${p1}</span>`;
      });

      const emojiOptions = [{ type: 'laugh', icon: '😂' }, { type: 'scared', icon: '😱' }];
      let emojiHTML = emojiOptions.map(opt => {
        const count = reactions[opt.type] || 0;
        const reacted = localStorage.getItem(`voted_${gossip.id}_${opt.type}`) === 'true';
        return `<button class="emoji-btn ${reacted ? 'reacted' : ''}" onclick="reactEmoji('${gossip.id}', '${opt.type}')" ${reacted ? 'disabled' : ''}>${opt.icon} ${count > 0 ? `<span class="emoji-count">${count}</span>` : ''}</button>`;
      }).join('');

      // Рендер случайного опроса (для примера берем первый из базы)
      let pollHTML = '';
      if (allPolls.length > 0 && Math.random() > 0.5) { // Показываем опросы случайным образом в ленте
        const poll = allPolls[0]; 
        // Для простоты показываем только один опрос
      }

      return `
        <div class="gossip-card">
          ${gossip.image_url ? `<img src="${gossip.image_url}" class="gossip-image" loading="lazy">` : ''}
          <div class="gossip-content">
            <div class="gossip-author">
              ${gossip.emoji || '🦊'} ${gossip.author} 
              ${gossip.author_class ? `<span class="badge">${gossip.author_class}</span>` : ''}
            </div>
            <div class="gossip-text">${displayText}</div>
            
            <div class="action-row">
              <button class="action-btn ${liked ? 'liked' : ''}" onclick="likeGossip('${gossip.id}')" ${liked || disliked ? 'disabled' : ''}>👍 <span>${gossip.likes || 0}</span></button>
              <button class="action-btn ${disliked ? 'disliked' : ''}" onclick="dislikeGossip('${gossip.id}')" ${liked || disliked ? 'disabled' : ''}>👎 <span>${gossip.dislikes || 0}</span></button>
            </div>

            <div class="emoji-reactions">
              ${emojiHTML}
            </div>
          </div>
        </div>
      `;
    }

    window.openTab = (tabName, btn) => {
      let i, tabcontent = document.getElementsByClassName("tab-content");
      for (i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
      let tablinks = document.getElementsByClassName("nav-btn");
      for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
      document.getElementById(tabName).classList.add("active");
      btn.classList.add("active");
    }

    window.onload = () => {
      generateNick();
      autoTheme();
      loadData();
      updateOnlineStatus();
    };
  </script>
</body>
</html>
